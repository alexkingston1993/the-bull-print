name: Relentless Autonomous Supervisor (16 Videos Quota Enforcer)

on:
  schedule:
    - cron: '*/30 * * * *'  # Relentless 30-minute quota audit 24/7
  workflow_run:
    workflows:
      - "Master Autonomous Scheduler (Market Pulse + Bull Print Video Engine)"
      - "Flipzon & The Bull Print 100% Cloud Media Engine"
      - "20-Runner Parallel Cloud Video Matrix (The Bull Print)"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  audit-and-enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Watchdog Dependencies
        run: |
          pip install requests loguru

      - name: 🔑 Materialize Tokens for YouTube Channel Audit
        run: |
          mkdir -p data/youtube_tokens
          if [ -n "${{ secrets.YT_OAUTH_POOL_JSON }}" ]; then
            echo '${{ secrets.YT_OAUTH_POOL_JSON }}' > data/youtube_tokens/oauth_pool.json
          fi

      - name: 🎯 Execute Relentless Autonomous Supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PAT_TOKEN: ${{ secrets.GITHUB_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_OAUTH_POOL_JSON: ${{ secrets.YT_OAUTH_POOL_JSON }}
          YOUTUBE_TOKEN_EN: ${{ secrets.YOUTUBE_TOKEN_EN }}
        run: |
          python scripts/autonomous_watchdog.py
