name: Make Videos Public

on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: 'Comma-separated YouTube video IDs to make public'
        required: false
        default: 'lSdRmaHCets, m34Yd5TphF0'

permissions:
  contents: write

jobs:
  make_public:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Dependencies
        run: |
          pip install --no-cache-dir requests loguru google-api-python-client google-auth google-auth-oauthlib toml Pillow

      - name: 🔑 Materialize YouTube OAuth Tokens
        env:
          YOUTUBE_TOKEN_EN: ${{ secrets.YOUTUBE_TOKEN_EN }}
          YT_OAUTH_POOL_JSON: ${{ secrets.YT_OAUTH_POOL_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          mkdir -p data/youtube_tokens
          if [ -n "$YOUTUBE_TOKEN_EN" ]; then
            echo "$YOUTUBE_TOKEN_EN" | base64 -d > data/youtube_tokens/youtube_token_en.pickle
          fi
          if [ -n "$YT_OAUTH_POOL_JSON" ]; then
            echo "$YT_OAUTH_POOL_JSON" > data/youtube_tokens/oauth_pool.json
          fi

      - name: 🚀 Set Videos to Public
        env:
          YOUTUBE_TOKEN_EN: ${{ secrets.YOUTUBE_TOKEN_EN }}
          YT_OAUTH_POOL_JSON: ${{ secrets.YT_OAUTH_POOL_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          VIDEO_IDS: ${{ github.event.inputs.video_ids || 'lSdRmaHCets, m34Yd5TphF0' }}
        run: |
          IFS=',' read -ra ADDR <<< "$VIDEO_IDS"
          python scripts/make_videos_public.py "${ADDR[@]}"
