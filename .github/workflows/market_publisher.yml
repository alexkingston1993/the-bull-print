name: Market Pulse Educational Article Engine

on:
  schedule:
    - cron: '33 3 * * 1-5'   # 09:03 AM IST  — article: Pre-Market / Open Brief
    - cron: '33 5 * * 1-5'   # 11:03 AM IST  — article: Morning Momentum & Sector Rotation
    - cron: '03 8 * * 1-5'   # 13:33 PM IST  — article: Mid-Day / European Cues
    - cron: '33 10 * * 1-5'  # 16:03 PM IST  — article: Closing Bell Wrap & Top Movers
    - cron: '03 14 * * 1-5'  # 19:33 PM IST  — article: Evening FII/DII Deep Dive
    - cron: '33 5 * * 6'     # 11:03 AM IST Saturday — article: Weekend Masterclass
  workflow_dispatch:
    inputs:
      article_slot:
        description: 'Market slot name — e.g. pre_market, mid_day, closing_bell'
        required: false
        default: 'pre_market'

permissions:
  contents: write

jobs:
  # ─────────────────────────── ARTICLE ENGINE (Market Pulse) ───────────────────────────
  publish_article:
    concurrency:
      group: market-pulse-article-conveyor
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Market Article Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LLM_PROVIDER: "gemini"
          GEMINI_MODEL_NAME: "gemini-flash-latest"
          VOICE_NAME: "christopher"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SLOT="${{ github.event.inputs.article_slot || 'scheduled_cron' }}"
          echo "🚀 Running autonomous market article cycle for slot: $SLOT"
          python -m app.services.autonomous_scheduler --now "$SLOT"

      - name: Commit and Push New Articles to GitHub
        run: |
          git config --global user.name "Market Pulse Bot"
          git config --global user.email "bot@marketpulse.media"
          git add content/
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "feat(market): autonomous market news release [skip ci]" || true
            for retry in 1 2 3; do
              git fetch origin main
              git rebase -X ours origin/main || { git rebase --abort; git merge -X ours origin/main -m "merge: resolve content sync" || true; }
              if git push origin main; then
                echo "✓ Successfully pushed updated articles"
                break
              fi
              sleep 5
            done
          fi
