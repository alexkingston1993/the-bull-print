name: Daily Production Supervisor & Auto-Healer (6 AM - 10 AM IST)

on:
  schedule:
    - cron: '30 0,1,2,3,4 * * *'  # Exactly 6:00, 7:00, 8:00, 9:00, 10:00 AM IST Daily
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  supervise-and-auto-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Supervisor Dependencies
        run: |
          pip install --no-cache-dir requests loguru google-api-python-client google-auth google-auth-oauthlib toml

      - name: 🔑 Materialize YouTube OAuth Tokens
        env:
          YOUTUBE_TOKEN_EN: ${{ secrets.YOUTUBE_TOKEN_EN }}
          YT_OAUTH_POOL_JSON: ${{ secrets.YT_OAUTH_POOL_JSON }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID_1: ${{ secrets.YT_CLIENT_ID_1 }}
          YT_CLIENT_SECRET_1: ${{ secrets.YT_CLIENT_SECRET_1 }}
          YT_REFRESH_TOKEN_1: ${{ secrets.YT_REFRESH_TOKEN_1 }}
        run: |
          mkdir -p data/youtube_tokens
          if [ -n "$YOUTUBE_TOKEN_EN" ]; then
            echo "$YOUTUBE_TOKEN_EN" | base64 -d > data/youtube_tokens/youtube_token_en.pickle
          fi
          if [ -n "$YT_OAUTH_POOL_JSON" ]; then
            echo "$YT_OAUTH_POOL_JSON" > data/youtube_tokens/oauth_pool.json
          fi

      - name: 🛡️ Execute Daily Supervisor & Auto-Healing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_TOKEN_EN: ${{ secrets.YOUTUBE_TOKEN_EN }}
          YT_OAUTH_POOL_JSON: ${{ secrets.YT_OAUTH_POOL_JSON }}
        run: |
          python scripts/daily_production_supervisor.py
