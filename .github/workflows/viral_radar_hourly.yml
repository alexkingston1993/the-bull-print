name: Real-Time Hourly Viral Radar (Ad-Hoc Breaking News)

on:
  schedule:
    - cron: '0 * * * *'  # Every hour, 24/7
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scan-viral-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Radar Dependencies
        run: |
          pip install --no-cache-dir requests loguru google-genai toml

      - name: 📡 Execute Hourly Viral Radar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/hourly_viral_radar.py
